version: 2
updates:
  # Avisos y PRs automáticos cuando una dependencia tiene una versión nueva o
  # una vulnerabilidad conocida.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Agrupa actualizaciones menores/parches para no abrir decenas de PRs.
      dependencias-menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
